[package]
name = "rasa-launcher"
version = "1.0.0"
description = "Infinite Rasa Launcher"
license = "MIT"
authors = ["Infinite Rasa"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rasa_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rss = { version = "2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

# Saved passwords go to the desktop keyring (Secret Service) on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
