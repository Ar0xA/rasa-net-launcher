<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Rasa</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main>
      <img src="/src/logo.png" class="logo" alt="Infinite Rasa" />

      <p id="status">Checking install…</p>
      <progress id="progress" hidden></progress>
      <ul id="problems" hidden></ul>

      <button id="play" class="play" disabled>Play</button>
      <label class="option"><input type="checkbox" id="skip-intro" /> Skip intro movie</label>

      <div class="actions">
        <button id="browse">Game folder…</button>
        <button id="verify" disabled>Full verify</button>
      </div>
      <p id="path" class="path"></p>
    </main>
  </body>
</html>
