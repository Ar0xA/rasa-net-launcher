name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tag (v1.2.3) is the source of truth for the version.
      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8NoBOM

      - run: npm ci

      # Signed updater artifacts (setup.exe.sig) are only produced in CI,
      # so local builds don't need the private key.
      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Collect installer, checksum and update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          $name = "InfiniteRasaLauncher-$env:VERSION-setup.exe"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "release/$name"

          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content release/SHA256SUMS.txt -Encoding ascii

          # Read by the launcher's updater from releases/latest/download/latest.json
          [ordered]@{
            version   = $env:VERSION
            notes     = "Infinite Rasa Launcher $env:VERSION"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content release/latest.json -Encoding utf8NoBOM

      - uses: softprops/action-gh-release@v2
        with:
          name: Infinite Rasa Launcher ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/latest.json
